[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsvtlab"
version = "0.1.0"
description = "Quantum Singular Value Transformation in PennyLane: high-degree QSP phases, linear systems and Hamiltonian simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pennylane>=0.40", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["qsvtlab"]
